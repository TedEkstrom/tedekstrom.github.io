<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labbar</title>
<style>
  :root {
    --bg: #f6f7f4;
    --surface: #ffffff;
    --text: #1d2420;
    --muted: #66706a;
    --line: #d9ddd6;
    --accent: #1f6f5c;
    --accent-bg: #e6f2ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151a17;
      --surface: #1d2420;
      --text: #e8ece8;
      --muted: #96a09a;
      --line: #2f3833;
      --accent: #6cc4aa;
      --accent-bg: #23312c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 4rem 1.25rem 3rem;
  }
  h1 {
    font-size: 2.25rem;
    margin: 0 0 .25rem;
    letter-spacing: -0.02em;
  }
  .sub { color: var(--muted); margin: 0 0 2rem; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .6rem; }
  a.lab {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    padding: 1rem 1.15rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: inherit;
    text-decoration: none;
    transition: border-color .15s, background .15s;
  }
  a.lab:hover { border-color: var(--accent); background: var(--accent-bg); }
  a.lab:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .name { font-size: 1.15rem; font-weight: 600; }
  .path { color: var(--muted); font-size: .9rem; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .status { color: var(--muted); }
  .error {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid #c0492f;
    border-radius: 6px;
    padding: 1rem 1.15rem;
  }
  .error p { margin: .25rem 0; }
  @media (max-width: 460px) {
    a.lab { flex-direction: column; gap: .1rem; }
  }
</style>
</head>
<body>
<main>
  <h1>Labbar</h1>
  <p class="sub">Välj en labb för att öppna den.</p>
  <div id="content"><p class="status">Hämtar labbar …</p></div>
</main>

<script>
  /* ------------------------------------------------------------------
     Inställningar. Normalt behöver du inte ändra något här: användarnamn
     och repo läses av från sidans adress (anvandare.github.io/repo/).
     Fyll i värdena manuellt om du använder en egen domän eller testar lokalt.
  ------------------------------------------------------------------- */
  const CONFIG = {
    owner: "",   // t.ex. "minanvandare"
    repo: "",    // t.ex. "mitt-repo"
    // Mappar som aldrig ska visas, även om de innehåller en index.html
    exclude: []  // t.ex. ["test", "arkiv"]
  };

  const content = document.getElementById("content");

  function detectRepo() {
    if (CONFIG.owner && CONFIG.repo) {
      return { owner: CONFIG.owner, repo: CONFIG.repo };
    }
    const host = location.hostname;
    if (!host.endsWith(".github.io")) return null;
    const owner = host.replace(".github.io", "");
    const firstSegment = location.pathname.split("/").filter(Boolean)[0];
    // Utan sökvägssegment är det användarsidan: anvandare.github.io
    const repo = firstSegment && !firstSegment.endsWith(".html") ? firstSegment : host;
    return { owner, repo };
  }

  function showError(title, hint) {
    content.innerHTML = "";
    const box = document.createElement("div");
    box.className = "error";
    const p1 = document.createElement("p");
    p1.innerHTML = "<strong></strong>";
    p1.firstChild.textContent = title;
    const p2 = document.createElement("p");
    p2.textContent = hint;
    box.append(p1, p2);
    content.appendChild(box);
  }

  function render(folders) {
    content.innerHTML = "";
    if (folders.length === 0) {
      const p = document.createElement("p");
      p.className = "status";
      p.textContent = "Inga mappar med en index.html hittades.";
      content.appendChild(p);
      return;
    }
    const ul = document.createElement("ul");
    for (const folder of folders) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.className = "lab";
      a.href = encodeURIComponent(folder) + "/index.html";

      const name = document.createElement("span");
      name.className = "name";
      name.textContent = folder;

      const path = document.createElement("span");
      path.className = "path";
      path.textContent = folder + "/index.html";

      a.append(name, path);
      li.appendChild(a);
      ul.appendChild(li);
    }
    content.appendChild(ul);
  }

  async function load() {
    const info = detectRepo();
    if (!info) {
      showError(
        "Kunde inte avgöra vilket repo som ska läsas.",
        "Fyll i owner och repo i CONFIG högst upp i skriptet."
      );
      return;
    }

    // Ett enda anrop som listar alla filer i repot (standardgrenen)
    const url = `https://api.github.com/repos/${info.owner}/${info.repo}/git/trees/HEAD?recursive=1`;

    try {
      const res = await fetch(url, { headers: { Accept: "application/vnd.github+json" } });
      if (res.status === 403 || res.status === 429) {
        showError(
          "GitHub tillåter inte fler anrop just nu.",
          "Gränsen för anonyma anrop är nådd. Vänta en stund och ladda om sidan."
        );
        return;
      }
      if (res.status === 404) {
        showError(
          "Repot hittades inte.",
          `Kontrollerade ${info.owner}/${info.repo}. Repot måste vara publikt, annars blockerar GitHub anropet.`
        );
        return;
      }
      if (!res.ok) throw new Error("HTTP " + res.status);

      const data = await res.json();
      const found = new Set();
      for (const item of data.tree) {
        // Matchar bara "mapp/index.html" direkt under rotmappen
        const m = item.type === "blob" && item.path.match(/^([^/]+)\/index\.html$/);
        if (!m) continue;
        const folder = m[1];
        if (folder.startsWith(".") || folder.startsWith("_")) continue;
        if (CONFIG.exclude.includes(folder)) continue;
        found.add(folder);
      }

      // Naturlig sortering: labb2 kommer före labb10
      const folders = [...found].sort((a, b) =>
        a.localeCompare(b, "sv", { numeric: true, sensitivity: "base" })
      );
      render(folders);
    } catch (err) {
      showError(
        "Det gick inte att hämta listan över labbar.",
        "Kontrollera internetanslutningen och ladda om sidan."
      );
      console.error(err);
    }
  }

  load();
</script>
</body>
</html>
