<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kurser och labbar</title>
<style>
  :root {
    --bg: #f6f7f4;
    --surface: #ffffff;
    --text: #1d2420;
    --muted: #66706a;
    --line: #d9ddd6;
    --accent: #1f6f5c;
    --accent-bg: #e6f2ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151a17;
      --surface: #1d2420;
      --text: #e8ece8;
      --muted: #96a09a;
      --line: #2f3833;
      --accent: #6cc4aa;
      --accent-bg: #23312c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 4rem 1.25rem 3rem;
  }
  h1 {
    font-size: 2rem;
    margin: 0 0 .25rem;
    letter-spacing: -0.02em;
    overflow-wrap: anywhere;
  }
  .sub { color: var(--muted); margin: 0 0 2rem; }
  .back {
    display: inline-block;
    margin-bottom: 1.25rem;
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  .back:hover { text-decoration: underline; }
  .back:focus-visible, a.item:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .6rem; }
  a.item {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    padding: 1rem 1.15rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: inherit;
    text-decoration: none;
    transition: border-color .15s, background .15s;
  }
  a.item:hover { border-color: var(--accent); background: var(--accent-bg); }
  .name { font-size: 1.1rem; font-weight: 600; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: .9rem; white-space: nowrap; }
  .path { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .status { color: var(--muted); }
  .error {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid #c0492f;
    border-radius: 6px;
    padding: 1rem 1.15rem;
  }
  .error p { margin: .25rem 0; }
  @media (max-width: 460px) {
    a.item { flex-direction: column; gap: .1rem; }
  }
</style>
</head>
<body>
<main id="app"><p class="status">Hämtar kurser …</p></main>

<script>
  /* ------------------------------------------------------------------
     Förväntad struktur i repot:
       Kursmapp/labbmapp/index.html
     t.ex. "Drift- och konfigurationsystem för klienter HT26/labb1/index.html"

     Användarnamn och repo läses av från sidans adress. Fyll i dem manuellt
     bara om du använder egen domän eller testar lokalt.
  ------------------------------------------------------------------- */
  const CONFIG = {
    owner: "",   // t.ex. "TedEkstrom"
    repo: "",    // t.ex. "tedekstrom.github.io"
    exclude: []  // kursmappar som aldrig ska visas, t.ex. ["test"]
  };

  const app = document.getElementById("app");
  let courses = null; // { kursnamn: [labbnamn, ...] }

  const collator = new Intl.Collator("sv", { numeric: true, sensitivity: "base" });

  function detectRepo() {
    if (CONFIG.owner && CONFIG.repo) return { owner: CONFIG.owner, repo: CONFIG.repo };
    const host = location.hostname;
    if (!host.endsWith(".github.io")) return null;
    const owner = host.replace(".github.io", "");
    const first = location.pathname.split("/").filter(Boolean)[0];
    const repo = first && !first.endsWith(".html") ? first : host;
    return { owner, repo };
  }

  function el(tag, className, text) {
    const e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function showError(title, hint) {
    app.replaceChildren();
    const box = el("div", "error");
    const p1 = el("p");
    p1.appendChild(el("strong", "", title));
    box.append(p1, el("p", "", hint));
    app.appendChild(box);
  }

  function itemLink(href, name, metaText, metaClass) {
    const li = el("li");
    const a = el("a", "item");
    a.href = href;
    a.append(el("span", "name", name), el("span", "meta " + (metaClass || ""), metaText));
    li.appendChild(a);
    return li;
  }

  function renderCourses() {
    document.title = "Kurser";
    app.replaceChildren(el("h1", "", "Kurser"), el("p", "sub", "Välj en kurs för att se dess labbar."));
    const names = Object.keys(courses).sort(collator.compare);
    if (names.length === 0) {
      app.appendChild(el("p", "status", "Inga kurser hittades. Skapa en mapp med undermappar som innehåller index.html."));
      return;
    }
    const ul = el("ul");
    for (const name of names) {
      const n = courses[name].length;
      ul.appendChild(itemLink("#" + encodeURIComponent(name), name, n + (n === 1 ? " labb" : " labbar")));
    }
    app.appendChild(ul);
  }

  function renderLabs(course) {
    const labs = courses[course];
    const back = el("a", "back", "← Alla kurser");
    back.href = "#";
    if (!labs) {
      app.replaceChildren(back, el("h1", "", "Kursen hittades inte"),
        el("p", "sub", "Det finns ingen kursmapp med namnet ”" + course + "” som innehåller labbar."));
      return;
    }
    document.title = course;
    app.replaceChildren(back, el("h1", "", course), el("p", "sub", "Välj en labb för att öppna den."));
    const ul = el("ul");
    for (const lab of labs) {
      const href = encodeURIComponent(course) + "/" + encodeURIComponent(lab) + "/index.html";
      ul.appendChild(itemLink(href, lab, lab + "/index.html", "path"));
    }
    app.appendChild(ul);
  }

  function route() {
    if (!courses) return;
    const hash = location.hash.slice(1);
    if (hash) {
      let course;
      try { course = decodeURIComponent(hash); } catch { course = hash; }
      renderLabs(course);
    } else {
      renderCourses();
    }
    window.scrollTo(0, 0);
  }

  async function load() {
    const info = detectRepo();
    if (!info) {
      showError("Kunde inte avgöra vilket repo som ska läsas.",
        "Fyll i owner och repo i CONFIG högst upp i skriptet.");
      return;
    }

    // Ett enda anrop som listar alla filer i repot (standardgrenen)
    const url = `https://api.github.com/repos/${info.owner}/${info.repo}/git/trees/HEAD?recursive=1`;

    try {
      const res = await fetch(url, { headers: { Accept: "application/vnd.github+json" } });
      if (res.status === 403 || res.status === 429) {
        showError("GitHub tillåter inte fler anrop just nu.",
          "Gränsen för anonyma anrop är nådd. Vänta en stund och ladda om sidan.");
        return;
      }
      if (res.status === 404) {
        showError("Repot hittades inte.",
          `Kontrollerade ${info.owner}/${info.repo}. Repot måste vara publikt.`);
        return;
      }
      if (!res.ok) throw new Error("HTTP " + res.status);

      const data = await res.json();
      const found = {};
      for (const item of data.tree) {
        // Matchar "kurs/labb/index.html"
        const m = item.type === "blob" && item.path.match(/^([^/]+)\/([^/]+)\/index\.html$/);
        if (!m) continue;
        const [, course, lab] = m;
        if (/^[._]/.test(course) || /^[._]/.test(lab)) continue;
        if (CONFIG.exclude.includes(course)) continue;
        (found[course] ||= []).push(lab);
      }
      for (const c in found) found[c].sort(collator.compare);

      courses = found;
      route();
    } catch (err) {
      showError("Det gick inte att hämta listan över kurser.",
        "Kontrollera internetanslutningen och ladda om sidan.");
      console.error(err);
    }
  }

  window.addEventListener("hashchange", route);
  load();
</script>
</body>
</html>
