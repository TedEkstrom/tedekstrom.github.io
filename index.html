<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kurser och labbar</title>
<style>
  :root {
    --bg: #f6f7f4; --surface: #ffffff; --text: #1d2420; --muted: #66706a;
    --line: #d9ddd6; --accent: #1f6f5c; --accent-bg: #e6f2ee; --danger: #c0492f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151a17; --surface: #1d2420; --text: #e8ece8; --muted: #96a09a;
      --line: #2f3833; --accent: #6cc4aa; --accent-bg: #23312c; --danger: #e5826b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
  main { max-width: 640px; margin: 0 auto; padding: 3rem 1.25rem 3rem; }
  h1 { font-size: 2rem; margin: 0 0 .25rem; letter-spacing: -0.02em; overflow-wrap: anywhere; }
  .sub { color: var(--muted); margin: 0 0 2rem; }
  .back { display: inline-block; margin-bottom: 1.25rem; color: var(--accent); text-decoration: none; font-weight: 600; }
  .back:hover { text-decoration: underline; }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .6rem; }
  a.item { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
    padding: 1rem 1.15rem; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    color: inherit; text-decoration: none; transition: border-color .15s, background .15s; }
  a.item:hover { border-color: var(--accent); background: var(--accent-bg); }
  .name { font-size: 1.1rem; font-weight: 600; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: .9rem; white-space: nowrap; }
  .path { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .status { color: var(--muted); }
  .error { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--danger);
    border-radius: 6px; padding: 1rem 1.15rem; }
  .error p { margin: .25rem 0; }
  @media (max-width: 460px) { a.item { flex-direction: column; gap: .1rem; } }
</style>
</head>
<body>
<main id="app"><p class="status">Hämtar kurser …</p></main>

<script>
  /* Struktur i repot: Kursmapp/labbmapp/index.html
     Synlighet styrs av labbar.json i roten av repot (valfri fil). Exempel:
     {
       "Kursens namn": {
         "_kurs":  { "nyckel": "<hash>" },
         "labb1":  { "visa": "2026-09-01" },
         "labb2":  { "dolj": true }
       }
     }
     dolj = göm alltid, visa = visa först från datumet (ÅÅÅÅ-MM-DD),
     nyckel = visa bara om adressen har ?nyckel=KOD (hash skapas av skapa_nyckel.py).
     Owner/repo läses från adressen; fyll i manuellt bara vid egen domän. */
  const CONFIG = { owner: "", repo: "", exclude: [] };

  const app = document.getElementById("app");
  const collator = new Intl.Collator("sv", { numeric: true, sensitivity: "base" });

  let info = null, tree = null, settings = {}, viewerHashes = new Set();

  /* ---------- hjälpfunktioner ---------- */
  const today = () => new Date().toLocaleDateString("sv-SE"); // ÅÅÅÅ-MM-DD

  async function sha256hex(str) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  }

  async function readKeys() {
    const raw = new URLSearchParams(location.search).get("nyckel") || "";
    const codes = raw.split(",").map(x => x.trim()).filter(Boolean);
    try { viewerHashes = new Set(await Promise.all(codes.map(sha256hex))); } catch { viewerHashes = new Set(); }
  }

  function el(tag, className, text) {
    const e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function detectRepo() {
    if (CONFIG.owner && CONFIG.repo) return { owner: CONFIG.owner, repo: CONFIG.repo };
    const host = location.hostname;
    if (!host.endsWith(".github.io")) return null;
    const first = location.pathname.split("/").filter(Boolean)[0];
    return { owner: host.replace(".github.io", ""), repo: first && !first.endsWith(".html") ? first : host };
  }

  function showError(title, hint) {
    const box = el("div", "error");
    const p = el("p"); p.appendChild(el("strong", "", title));
    box.append(p, el("p", "", hint));
    app.replaceChildren(box);
  }

  /* ---------- synlighet ---------- */
  const entry = (course, key) => (settings[course] && settings[course][key]) || {};
  const entryVisible = s =>
    !s.dolj && !(s.visa && s.visa > today()) && (!s.nyckel || viewerHashes.has(s.nyckel));
  const labVisible = (course, lab) => entryVisible(entry(course, "_kurs")) && entryVisible(entry(course, lab));
  const visibleLabs = course => tree[course].filter(l => labVisible(course, l));
  const visibleCourses = () => Object.keys(tree).filter(c => visibleLabs(c).length > 0).sort(collator.compare);

  /* ---------- rendering ---------- */
  function itemRow(href, name, metaText, metaClass) {
    const li = el("li");
    const a = el("a", "item"); a.href = href;
    a.append(el("span", "name", name), el("span", "meta " + (metaClass || ""), metaText));
    li.appendChild(a);
    return li;
  }

  function renderCourses() {
    document.title = "Kurser";
    app.append(el("h1", "", "Kurser"), el("p", "sub", "Välj en kurs för att se dess labbar."));
    const names = visibleCourses();
    if (!names.length) {
      app.appendChild(el("p", "status", "Inget att visa just nu. Har du fått en länk med nyckel? Öppna den länken."));
      return;
    }
    const ul = el("ul");
    for (const name of names) {
      const n = visibleLabs(name).length;
      ul.appendChild(itemRow("#" + encodeURIComponent(name), name, n + (n === 1 ? " labb" : " labbar")));
    }
    app.appendChild(ul);
  }

  function renderLabs(course) {
    const back = el("a", "back", "← Alla kurser"); back.href = "#";
    if (!tree[course] || !visibleCourses().includes(course)) {
      app.append(back, el("h1", "", "Kursen hittades inte"),
        el("p", "sub", "Det finns ingen tillgänglig kurs med namnet ”" + course + "”."));
      return;
    }
    document.title = course;
    app.append(back, el("h1", "", course), el("p", "sub", "Välj en labb för att öppna den."));
    const ul = el("ul");
    for (const lab of visibleLabs(course)) {
      const href = encodeURIComponent(course) + "/" + encodeURIComponent(lab) + "/index.html";
      ul.appendChild(itemRow(href, lab, lab + "/index.html", "path"));
    }
    app.appendChild(ul);
  }

  function render() {
    if (!tree) return;
    const hash = location.hash.slice(1);
    app.replaceChildren();
    if (hash) {
      let c; try { c = decodeURIComponent(hash); } catch { c = hash; }
      renderLabs(c);
    } else renderCourses();
    window.scrollTo(0, 0);
  }

  /* ---------- hämta data ---------- */
  async function loadSettings() {
    try {
      const r = await fetch("labbar.json", { cache: "no-store" });
      if (r.ok) settings = await r.json();
    } catch { /* ingen eller ogiltig fil: allt visas */ }
    if (typeof settings !== "object" || settings === null) settings = {};
  }

  async function load() {
    info = detectRepo();
    if (!info) { showError("Kunde inte avgöra vilket repo som ska läsas.", "Fyll i owner och repo i CONFIG högst upp i skriptet."); return; }
    try {
      const res = await fetch(`https://api.github.com/repos/${info.owner}/${info.repo}/git/trees/HEAD?recursive=1`,
        { headers: { Accept: "application/vnd.github+json" } });
      if (res.status === 403 || res.status === 429) { showError("GitHub tillåter inte fler anrop just nu.", "Vänta en stund och ladda om sidan."); return; }
      if (res.status === 404) { showError("Repot hittades inte.", `Kontrollerade ${info.owner}/${info.repo}. Repot måste vara publikt.`); return; }
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const found = {};
      for (const item of data.tree) {
        const m = item.type === "blob" && item.path.match(/^([^/]+)\/([^/]+)\/index\.html$/);
        if (!m) continue;
        const [, course, lab] = m;
        if (/^[._]/.test(course) || /^[._]/.test(lab) || CONFIG.exclude.includes(course)) continue;
        (found[course] ||= []).push(lab);
      }
      for (const c in found) found[c].sort(collator.compare);
      tree = found;
      await readKeys();
      await loadSettings();
      render();
    } catch (err) {
      showError("Det gick inte att hämta listan över kurser.", "Kontrollera internetanslutningen och ladda om sidan.");
      console.error(err);
    }
  }

  window.addEventListener("hashchange", render);
  load();
</script>
</body>
</html>
